services:
  - type: web
    name: team-task-manager
    runtime: node
    plan: free
    buildCommand: npm ci && npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: team-task-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: team-task-manager-db
    plan: free
